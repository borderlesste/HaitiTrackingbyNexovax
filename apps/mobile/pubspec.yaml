name: haiti_tracking
description: "Haiti Tracking by Nexovax - misiones geográficas colaborativas."
publish_to: 'none'
version: 0.1.2+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  intl: any
  geolocator: ^14.1.2
  image_picker: ^1.2.4
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  firebase_core: ^5.2.0
  firebase_crashlytics: ^6.1.0
  url_launcher: ^6.3.1
  in_app_update: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
